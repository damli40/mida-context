<svg xmlns="http://www.w3.org/2000/svg" width="640" height="832" viewBox="0 0 640 832" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Claude Code to a fresh Codex session, through Mida</title>
  <desc id="desc">Mida encrypts the checkpoint on your machine and hands it to Codex with your approval. Monad testnet separately records authority and provenance: permissions, revocations, authors and record fingerprints. Context content stays off-chain.</desc>
  <style>
    .bg{fill:#f6f8fa}.card{fill:#ffffff;stroke:#cbd5e1}.mida{fill:#eef6f2;stroke:#287957}.ink{fill:#172b26}.muted{fill:#465b54}.accent{fill:#216344}.line{stroke:#287957}.ledger{fill:#f0f2f7;stroke:#bac3d2}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .label{font-size:19px;font-weight:600;letter-spacing:1.4px}.name{font-size:32px;font-weight:650}.body{font-size:23px}.small{font-size:21px}
    @media(prefers-color-scheme:dark){.bg{fill:#0d1117}.card{fill:#161b22;stroke:#46515f}.mida{fill:#142b23;stroke:#72cba0}.ink{fill:#f0f6f3}.muted{fill:#bdccc4}.accent{fill:#8cdbb2}.line{stroke:#8cdbb2}.ledger{fill:#1a202c;stroke:#566176}}
  </style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="m1 1 5 3-5 3" class="line" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect width="640" height="832" rx="20" class="bg"/>
  <text x="32" y="36" class="label muted">ONE TASK. A FRESH SESSION.</text>
  <rect x="32" y="60" width="560" height="128" rx="16" class="card" stroke-width="1.5"/>
  <text x="56" y="99" class="label muted">01 / WORK</text>
  <text x="56" y="138" class="name ink">Claude Code</text>
  <text x="56" y="169" class="body muted">Goal, decisions, constraints, next steps</text>
  <path d="M312 190v43" class="line" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="32" y="246" width="560" height="184" rx="16" class="mida" stroke-width="2"/>
  <text x="56" y="285" class="label accent">02 / KEEP CONTEXT</text>
  <text x="56" y="324" class="name ink">Mida</text>
  <text x="56" y="362" class="body ink">Checkpoint encrypted on your machine</text>
  <text x="56" y="400" class="body muted">You approve or revoke access.</text>
  <path d="M312 432v43" class="line" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="32" y="488" width="560" height="128" rx="16" class="card" stroke-width="1.5"/>
  <text x="56" y="527" class="label muted">03 / CONTINUE</text>
  <text x="56" y="566" class="name ink">Fresh Codex session</text>
  <text x="56" y="597" class="body muted">Approved handoff → “Continue.”</text>
  <path d="M592 338h20v394h-20" class="line" stroke-width="1.5" stroke-dasharray="5 5"/>
  <rect x="32" y="672" width="560" height="132" rx="16" class="ledger" stroke-width="1.5"/>
  <text x="56" y="709" class="label muted">AUTHORITY + PROVENANCE</text>
  <text x="56" y="744" class="body ink" font-weight="650">Monad testnet</text>
  <text x="56" y="773" class="small muted">Permissions · revocations · authors · fingerprints</text>
  <text x="32" y="650" class="small muted">Context stays off-chain.</text>
</svg>
