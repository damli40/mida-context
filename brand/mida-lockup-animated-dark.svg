<svg xmlns="http://www.w3.org/2000/svg" viewBox="-0.43 10.50 280.08 79.00" width="280" height="79" role="img" aria-label="Mida">
<title>Mida</title>
<style>
.arc{fill:none;stroke:#FAF9F5;stroke-width:11;stroke-linecap:round;stroke-dasharray:100 110;stroke-dashoffset:0}
.l{animation:draw .9s cubic-bezier(.65,0,.35,1) .1s both,open-l 6s ease-in-out 2.4s infinite}
.r{animation:draw .9s cubic-bezier(.65,0,.35,1) .35s both,open-r 6s ease-in-out 2.4s infinite}
.dot{fill:#FAF9F5;transform-box:fill-box;transform-origin:center;animation:settle .7s cubic-bezier(.34,1.56,.64,1) .85s both}
.word{fill:#FAF9F5;animation:rise .8s cubic-bezier(.16,1,.3,1) 1.2s both}
@keyframes draw{from{stroke-dashoffset:105}to{stroke-dashoffset:0}}
@keyframes settle{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes rise{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes open-l{0%,100%{transform:translateX(0)}50%{transform:translateX(-3px)}}
@keyframes open-r{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.l,.r,.dot,.word{animation:none}}
</style>
