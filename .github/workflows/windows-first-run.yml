# A first run of Mida on a Windows machine, started by hand. There is one job, native,
# and it tests this branch rather than the published package: it checks out the ref,
# builds the workspace, packs the CLI and installs the tarball into a folder with a
# space in its path.
#
# Every step except mida doctor is a gate: if its check fails the job fails. The gated
# steps prove one end to end pass: init, a request for each of two agents, a typed
# approve, mida install writing Claude Code's hooks, Codex's config and Claude
# Desktop's tool server, one saved checkpoint delivered by each agent's own session
# start hook, a Stop hook capture that lands in the queue, and a revoke that ends the
# handoff. The revoke gate requires the revoke refusal line, and the hook gates
# require the hook's own "enqueued" log line.
#
# mida doctor is logged but never a gate. The runner has no Claude Code or Codex
# installed, so doctor reporting them missing is the expected result and must not
# fail the job.
name: Windows first run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DEMO_OBJECTIVE: "M0 demo checkpoint"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the machine
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\log" | Out-Null
          [System.Environment]::OSVersion.VersionString
          node --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pip install pywinpty 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\pip.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\pnpm-install.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build, pack and install this branch's CLI
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          git rev-parse HEAD | Tee-Object "$env:RUNNER_TEMP\log\commit.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:publish 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\build-publish.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\mida-pack" | Out-Null
          npm pack .\publish\cli --pack-destination "$env:RUNNER_TEMP\mida-pack" 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\npm-pack.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tarball = Get-ChildItem "$env:RUNNER_TEMP\mida-pack\*.tgz" | Select-Object -First 1
          if ($null -eq $tarball) { "FAIL: npm pack wrote no tarball"; exit 1 }
          "packed tarball: $($tarball.Name)" | Tee-Object "$env:RUNNER_TEMP\log\tarball.txt"
          npm install -g --prefix "C:\mida test\npm" $tarball.FullName 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\mida test\npm" | Add-Content $env:GITHUB_PATH
          $env:PATH = "C:\mida test\npm;$env:PATH"
          Get-Command mida, midad, mida-hook, mida-inject, mida-mcp | Format-Table Name, Source

      - name: mida init and a request for each agent, in a project folder
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force -Path "$HOME\demo-project" | Out-Null
          Set-Location "$HOME\demo-project"
          git init -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mida init 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\init.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mida request claude-code 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\request-claude-code.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          mida request codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\request-codex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Approve both agents with a typed yes
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          python "$env:GITHUB_WORKSPACE\scripts\windows-ci\answer-yes.py" cmd.exe /c mida approve --all 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\approve.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path .mida\project.json)) { "FAIL: .mida\project.json was not written"; exit 1 }

      - name: mida install claude-code
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          mida install claude-code 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install-claude-code.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: mida install codex
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          mida install codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install-codex.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: mida install claude-desktop
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          python "$env:GITHUB_WORKSPACE\scripts\windows-ci\answer-yes.py" cmd.exe /c mida install claude-desktop 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install-claude-desktop.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "$env:APPDATA\Claude\claude_desktop_config.json")) { "FAIL: Claude Desktop's config was not written"; exit 1 }

      - name: mida doctor
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          # doctor is expected to report that no model can write summaries here; do not fail on it
          mida doctor 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\doctor.txt"
          "doctor $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: Save one checkpoint as claude-code
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          $projectId = (Get-Content .mida\project.json -Raw | ConvertFrom-Json).projectId
          "project id: $projectId"
          mida save-demo claude-code $projectId 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\save.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log\save.txt" -Pattern "^saved 0x" -Quiet)) { "FAIL: save-demo did not print a saved checkpoint"; exit 1 }

      - name: Codex starts a session and receives the handoff
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          $payload = @{ session_id = "windows-first-run-1"; cwd = (Get-Location).Path; hook_event_name = "SessionStart"; source = "startup" } | ConvertTo-Json -Compress
          $payload | mida-inject codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\handoff.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log\handoff.txt" -SimpleMatch "${{ env.DEMO_OBJECTIVE }}" -Quiet)) { "FAIL: codex did not receive the checkpoint"; exit 1 }

      - name: The session-start hooks, run the way each agent runs them
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          node "$env:GITHUB_WORKSPACE\scripts\windows-ci\run-hook.mjs" claude-code "$HOME\demo-project" 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\run-hook-claude-code.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log\run-hook-claude-code.txt" -SimpleMatch "${{ env.DEMO_OBJECTIVE }}" -Quiet)) { "FAIL: claude-code's own hook entry did not deliver the checkpoint"; exit 1 }
          node "$env:GITHUB_WORKSPACE\scripts\windows-ci\run-hook.mjs" codex "$HOME\demo-project" powershell 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\run-hook-codex-powershell.txt"
          if ($LASTEXITCODE -ne 0) { "FAIL: codex's own hook entry through powershell exited $LASTEXITCODE"; exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log\run-hook-codex-powershell.txt" -SimpleMatch "${{ env.DEMO_OBJECTIVE }}" -Quiet)) { "FAIL: codex's own hook entry did not deliver the checkpoint through powershell"; exit 1 }
          node "$env:GITHUB_WORKSPACE\scripts\windows-ci\run-hook.mjs" codex "$HOME\demo-project" pwsh 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\run-hook-codex-pwsh.txt"
          if ($LASTEXITCODE -ne 0) { "FAIL: codex's own hook entry through pwsh exited $LASTEXITCODE"; exit $LASTEXITCODE }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log\run-hook-codex-pwsh.txt" -SimpleMatch "${{ env.DEMO_OBJECTIVE }}" -Quiet)) { "FAIL: codex's own hook entry did not deliver the checkpoint through pwsh"; exit 1 }
          node "$env:GITHUB_WORKSPACE\scripts\windows-ci\run-hook.mjs" codex "$HOME\demo-project" cmd 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\run-hook-codex-cmd.txt"
          $cmdExit = $LASTEXITCODE
          $cmdHasObjective = Select-String -Path "$env:RUNNER_TEMP\log\run-hook-codex-cmd.txt" -SimpleMatch "${{ env.DEMO_OBJECTIVE }}" -Quiet
          "run-hook codex cmd exit $cmdExit objective $cmdHasObjective" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"

      - name: The Codex config is valid TOML
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          python -c "import os,tomllib; tomllib.load(open(os.path.join(os.environ['USERPROFILE'], '.codex', 'config.toml'), 'rb'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The Claude Desktop tool server answers initialize
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          node "$env:GITHUB_WORKSPACE\scripts\windows-ci\mcp-hello.mjs" "$env:APPDATA\Claude\claude_desktop_config.json" 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\mcp-hello.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: The Stop hook as settings.json runs it, with no shell
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          $transcript = "$HOME\.claude\projects\ci\s.jsonl"
          New-Item -ItemType Directory -Force -Path (Split-Path $transcript) | Out-Null
          Set-Content -Path $transcript -Value '{"type":"user","message":{"role":"user","content":"ci"}}'
          $settings = Get-Content "$HOME\.claude\settings.json" -Raw | ConvertFrom-Json
          $hook = $settings.hooks.Stop[0].hooks[0]
          $hookArgs = @()
          if ($null -ne $hook.args) { $hookArgs = @($hook.args) }
          $payload = @{ session_id = "ci-capture"; transcript_path = $transcript; cwd = "$HOME\demo-project"; hook_event_name = "Stop" } | ConvertTo-Json -Compress
          $payload | & $hook.command @hookArgs 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\stop-hook-via-settings.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hookLog = "$HOME\.mida\logs\hook.jsonl"
          if (-not (Test-Path $hookLog)) { "FAIL: the hook log $hookLog does not exist"; exit 1 }
          $enqueued = $null
          foreach ($line in Get-Content $hookLog) {
            try { $entry = $line | ConvertFrom-Json } catch { continue }
            if ($entry.agent -eq "claude-code" -and $entry.event -eq "Stop" -and $entry.sessionId -eq "ci-capture" -and $entry.outcome -eq "enqueued" -and $entry.jobId) { $enqueued = $entry }
          }
          if ($null -eq $enqueued) { "FAIL: the Stop hook did not enqueue a job"; exit 1 }
          "enqueued job: $($enqueued.jobId)"
          if (Test-Path "$HOME\.mida\queue\bad\$($enqueued.jobId).json") { "FAIL: the queued job was rejected as malformed"; exit 1 }
          if (Test-Path "$HOME\.mida\queue\$($enqueued.jobId).json") { "queue file $($enqueued.jobId).json is still in the queue" } else { "queue file $($enqueued.jobId).json was already drained" }

      - name: A Stop hook capture through mida-hook directly
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          $transcript = "$HOME\.claude\projects\ci\s.jsonl"
          New-Item -ItemType Directory -Force -Path (Split-Path $transcript) | Out-Null
          Set-Content -Path $transcript -Value '{"type":"user","message":{"role":"user","content":"ci"}}'
          $payload = @{ session_id = "ci-capture-direct"; transcript_path = $transcript; cwd = (Get-Location).Path; hook_event_name = "Stop" } | ConvertTo-Json -Compress
          $payload | mida-hook claude-code 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\hook-capture.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hookLog = "$HOME\.mida\logs\hook.jsonl"
          if (-not (Test-Path $hookLog)) { "FAIL: the hook log $hookLog does not exist"; exit 1 }
          $enqueued = $null
          foreach ($line in Get-Content $hookLog) {
            try { $entry = $line | ConvertFrom-Json } catch { continue }
            if ($entry.agent -eq "claude-code" -and $entry.event -eq "Stop" -and $entry.sessionId -eq "ci-capture-direct" -and $entry.outcome -eq "enqueued" -and $entry.jobId) { $enqueued = $entry }
          }
          if ($null -eq $enqueued) { "FAIL: the Stop hook did not enqueue a job"; exit 1 }
          "enqueued job: $($enqueued.jobId)"
          if (Test-Path "$HOME\.mida\queue\bad\$($enqueued.jobId).json") { "FAIL: the queued job was rejected as malformed"; exit 1 }
          if (Test-Path "$HOME\.mida\queue\$($enqueued.jobId).json") { "queue file $($enqueued.jobId).json is still in the queue" } else { "queue file $($enqueued.jobId).json was already drained" }

      - name: Revoke codex, then its next session gets nothing
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          Set-Location "$HOME\demo-project"
          python "$env:GITHUB_WORKSPACE\scripts\windows-ci\answer-yes.py" cmd.exe /c mida revoke codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\revoke.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $payload = @{ session_id = "windows-first-run-2"; cwd = (Get-Location).Path; hook_event_name = "SessionStart"; source = "startup" } | ConvertTo-Json -Compress
          $payload | mida-inject codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\handoff-after-revoke.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$env:RUNNER_TEMP\log\handoff-after-revoke.txt" -SimpleMatch "${{ env.DEMO_OBJECTIVE }}" -Quiet) { "FAIL: a revoked agent still received the checkpoint"; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log\handoff-after-revoke.txt" -SimpleMatch "(revoked by the owner)" -Quiet)) { "FAIL: the handoff after revoke did not name the revoke as the reason"; exit 1 }
          node "$env:GITHUB_WORKSPACE\scripts\windows-ci\run-hook.mjs" codex "$HOME\demo-project" powershell 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\handoff-after-revoke-codex-way.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Select-String -Path "$env:RUNNER_TEMP\log\handoff-after-revoke-codex-way.txt" -SimpleMatch "${{ env.DEMO_OBJECTIVE }}" -Quiet) { "FAIL: a revoked agent still received the checkpoint through its own hook entry"; exit 1 }
          if (-not (Select-String -Path "$env:RUNNER_TEMP\log\handoff-after-revoke-codex-way.txt" -SimpleMatch "(revoked by the owner)" -Quiet)) { "FAIL: the handoff through the hook entry after revoke did not name the revoke as the reason"; exit 1 }

      - name: Key files are readable only by this user
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false
          pwsh "$env:GITHUB_WORKSPACE\scripts\windows-ci\check-acl.ps1" "$HOME\.mida\owner\secrets.json" "$HOME\.mida\midad.sock.path" 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\check-acl.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect Mida's own logs
        if: always()
        continue-on-error: true
        run: |
          $ErrorActionPreference = "Continue"
          if (Test-Path "$HOME\.mida\logs") {
            Copy-Item "$HOME\.mida\logs" "$env:RUNNER_TEMP\log\mida-logs" -Recurse -Force
          }
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-first-run-log
          path: ${{ runner.temp }}\log
