# A first run of Mida on a Windows machine, started by hand. Two jobs:
#
#   native: the published npm package on Windows itself. Mida does not support Windows yet;
#           this job exists to record exactly which steps fail and how. Every step is allowed
#           to fail, and the last step prints each step's exit code.
#   wsl:    the same first run as the Linux job, inside WSL (the Linux layer built into
#           Windows). This is the route a Windows user can try today.
#
# The `from` input picks what each job installs: `npm` (the default) is the published package,
# and `source` checks out the dispatched ref and installs the CLI built from it.
#
# Neither job has Claude Code or Codex, so the agents' own hooks never fire and no model writes
# a summary. Both use the hosted store and the hosted gas sponsor on Monad testnet: about ten
# sponsored transactions per job that gets as far as approving. Keys live only on the runner.
name: Windows first run

on:
  workflow_dispatch:
    inputs:
      version:
        description: "mida-context version to install from npm"
        required: false
        default: "latest"
      from:
        description: "what to install: the published npm package, or this ref built from source"
        type: choice
        options:
          - npm
          - source
        required: true
        default: "npm"

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The machine
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\log" | Out-Null
          [System.Environment]::OSVersion.VersionString
          node --version
          npm --version

      - uses: actions/checkout@v4
        if: inputs.from == 'source'

      - name: Install from npm
        if: inputs.from == 'npm'
        continue-on-error: true
        run: |
          npm install -g "mida-context@${{ inputs.version }}" 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install.txt"
          "install $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          Get-Command mida, midad, mida-hook, mida-inject, mida-mcp -ErrorAction SilentlyContinue | Format-Table Name, Source
          exit 0

      - name: Install from source
        if: inputs.from == 'source'
        continue-on-error: true
        run: |
          git rev-parse HEAD | Tee-Object "$env:RUNNER_TEMP\log\commit.txt"
          corepack enable
          pnpm --version | Tee-Object "$env:RUNNER_TEMP\log\pnpm-version.txt"
          pnpm install --frozen-lockfile 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\pnpm-install.txt"
          pnpm build:publish 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\build-publish.txt"
          $installCode = $LASTEXITCODE
          if ($installCode -eq 0) {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\mida-pack" | Out-Null
            npm pack .\publish\cli --pack-destination "$env:RUNNER_TEMP\mida-pack" 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\npm-pack.txt"
            $packCode = $LASTEXITCODE
            $tarball = Get-ChildItem "$env:RUNNER_TEMP\mida-pack\*.tgz" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($packCode -eq 0 -and $null -ne $tarball) {
              "packed tarball: $($tarball.Name)" | Tee-Object "$env:RUNNER_TEMP\log\tarball.txt"
              npm install -g $tarball.FullName 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install.txt"
              $installCode = $LASTEXITCODE
            } else {
              "npm pack wrote no tarball" | Tee-Object "$env:RUNNER_TEMP\log\tarball.txt"
              $installCode = 1
            }
          } else {
            "skipped: pnpm build:publish exited $installCode" | Tee-Object "$env:RUNNER_TEMP\log\install.txt"
          }
          "install $installCode" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          Get-Command mida, midad, mida-hook, mida-inject, mida-mcp -ErrorAction SilentlyContinue | Format-Table Name, Source
          exit 0

      - name: mida --help
        continue-on-error: true
        run: |
          mida --help 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\help.txt"
          "help $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: mida init
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mida init 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\init.txt"
          "init $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: mida doctor
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mida doctor 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\doctor.txt"
          "doctor $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: mida request, in a project folder
        continue-on-error: true
        timeout-minutes: 4
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME\demo-project" | Out-Null
          Set-Location "$HOME\demo-project"
          git init -q .
          mida request claude-code 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\request-claude-code.txt"
          "request-claude-code $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          mida request codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\request-codex.txt"
          "request-codex $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: mida approve --all (no terminal here; records what it says)
        continue-on-error: true
        timeout-minutes: 4
        run: |
          Set-Location "$HOME\demo-project"
          mida approve --all 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\approve.txt"
          "approve $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: mida install claude-code and codex
        continue-on-error: true
        timeout-minutes: 4
        run: |
          mida install claude-code 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install-claude-code.txt"
          "install-claude-code $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          mida install codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\install-codex.txt"
          "install-codex $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: The session-start hook, as an agent would call it
        continue-on-error: true
        timeout-minutes: 3
        run: |
          Set-Location "$HOME\demo-project"
          $payload = @{ session_id = "windows-first-run-1"; cwd = (Get-Location).Path; hook_event_name = "SessionStart"; source = "startup" } | ConvertTo-Json -Compress
          $payload | mida-inject codex 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\handoff.txt"
          "inject $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          exit 0

      - name: A hook save, as Claude Code's Stop hook would call it
        continue-on-error: true
        run: |
          Set-Location "$HOME\demo-project"
          $transcript = "$HOME\demo-project\hook-transcript.jsonl"
          Set-Content -Path $transcript -Value @(
            '{"type":"user","message":{"role":"user","content":"hello"}}',
            '{"type":"assistant","message":{"role":"assistant","content":"hi"}}'
          )
          # claude-code only trusts transcripts under ~/.claude/projects, so the session copy lives there
          $sessionTranscript = "$HOME\.claude\projects\demo-project\ci-hook-1.jsonl"
          New-Item -ItemType Directory -Force -Path "$HOME\.claude\projects\demo-project" | Out-Null
          Copy-Item $transcript $sessionTranscript
          $payload = @{ session_id = "ci-hook-1"; transcript_path = $sessionTranscript; cwd = (Get-Location).Path; hook_event_name = "Stop" } | ConvertTo-Json -Compress
          $payload | mida-hook claude-code 2>&1 | Tee-Object "$env:RUNNER_TEMP\log\hook-save.txt"
          "hook-save $LASTEXITCODE" | Add-Content "$env:RUNNER_TEMP\log\exit-codes.txt"
          "--- files in the Mida home's queue folder ---"
          if (Test-Path "$HOME\.mida\queue") {
            Get-ChildItem -Recurse -File "$HOME\.mida\queue" | ForEach-Object { $_.FullName.Substring("$HOME\.mida".Length + 1) } | Sort-Object | Tee-Object "$env:RUNNER_TEMP\log\hook-save-queue.txt"
          } else { "no queue folder" | Tee-Object "$env:RUNNER_TEMP\log\hook-save-queue.txt" }
          exit 0

      - name: What Mida left on disk, and what is running
        continue-on-error: true
        run: |
          if (Test-Path "$HOME\.mida") {
            Get-ChildItem -Recurse -File "$HOME\.mida" | ForEach-Object { $_.FullName.Substring("$HOME\.mida".Length + 1) } | Sort-Object | Tee-Object "$env:RUNNER_TEMP\log\files.txt"
            "--- who may read the owner's key file ---"
            if (Test-Path "$HOME\.mida\owner\secrets.json") { (Get-Acl "$HOME\.mida\owner\secrets.json").Access | Format-Table IdentityReference, FileSystemRights, AccessControlType | Out-String | Tee-Object "$env:RUNNER_TEMP\log\key-file-acl.txt" }
          } else { "no .mida folder was created" | Tee-Object "$env:RUNNER_TEMP\log\files.txt" }
          Get-CimInstance Win32_Process -Filter "Name = 'node.exe'" | Select-Object ProcessId, CommandLine | Format-List | Out-String | Tee-Object "$env:RUNNER_TEMP\log\node-processes.txt"
          exit 0

      - name: Summary
        if: always()
        run: |
          "## Windows first run, native" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Exit code of each step (0 = the command reported success):" | Add-Content $env:GITHUB_STEP_SUMMARY
          "" | Add-Content $env:GITHUB_STEP_SUMMARY
          if (Test-Path "$env:RUNNER_TEMP\log\exit-codes.txt") { Get-Content "$env:RUNNER_TEMP\log\exit-codes.txt" | ForEach-Object { "- $_" } | Add-Content $env:GITHUB_STEP_SUMMARY }
          Get-Content "$env:RUNNER_TEMP\log\exit-codes.txt" -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-first-run-log
          path: ${{ runner.temp }}/log

  wsl:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: wsl-bash {0}
    env:
      DEMO_OBJECTIVE: "M0 demo checkpoint"
    steps:
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          update: "true"
          additional-packages: curl ca-certificates expect git

      - uses: actions/checkout@v4
        if: inputs.from == 'source'

      - name: The machine
        run: |
          uname -a
          grep PRETTY_NAME /etc/os-release
          echo "WSL kernel: $(cat /proc/version)"
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash - > /dev/null
          apt-get install -y -q nodejs > /dev/null
          node --version
          npm --version
          mkdir -p /tmp/log

      - name: Install from npm
        if: inputs.from == 'npm'
        run: |
          npm install -g "mida-context@${{ inputs.version }}"
          which mida midad mida-hook mida-inject mida-mcp
          npm ls -g mida-context

      - name: Build and install from source
        if: inputs.from == 'source'
        run: |
          set -o pipefail
          SRC="${{ github.workspace }}"
          case "$SRC" in
            [A-Za-z]:*)
              drive=$(printf '%s' "$SRC" | cut -c1 | tr '[:upper:]' '[:lower:]')
              rest=$(printf '%s' "$SRC" | cut -c4- | tr '\\' '/')
              SRC="/mnt/$drive/$rest"
              ;;
          esac
          echo "checked-out workspace: $SRC"
          test -f "$SRC/package.json"
          cp -r "$SRC/." "$HOME/mida-src"
          cd "$HOME/mida-src"
          git rev-parse HEAD | tee /tmp/log/commit.txt
          corepack enable
          pnpm --version | tee /tmp/log/pnpm-version.txt
          pnpm install --frozen-lockfile 2>&1 | tee /tmp/log/pnpm-install.txt
          install_code=0
          pnpm build:publish 2>&1 | tee /tmp/log/build-publish.txt || install_code=${PIPESTATUS[0]}
          if [ "$install_code" -eq 0 ]; then
            mkdir -p /tmp/mida-pack
            npm pack ./publish/cli --pack-destination /tmp/mida-pack 2>&1 | tee /tmp/log/npm-pack.txt || pack_code=${PIPESTATUS[0]}
            tarball=$(ls -1 /tmp/mida-pack/*.tgz 2>/dev/null | head -n 1 || true)
            if [ "${pack_code:-0}" -eq 0 ] && [ -n "$tarball" ]; then
              echo "packed tarball: $(basename "$tarball")" | tee /tmp/log/tarball.txt
              npm install -g "$tarball" 2>&1 | tee /tmp/log/install.txt || install_code=${PIPESTATUS[0]}
            else
              echo "npm pack wrote no tarball" | tee /tmp/log/tarball.txt
              install_code=1
            fi
          else
            echo "skipped: pnpm build:publish exited $install_code" | tee /tmp/log/install.txt
          fi
          echo "install $install_code" | tee -a /tmp/log/install.txt
          which mida midad mida-hook mida-inject mida-mcp
          exit $install_code

      - name: mida init
        run: |
          set -o pipefail
          date -u +"start %FT%TZ" | tee /tmp/log/times.txt
          mida init 2>&1 | tee /tmp/log/init.txt
          test -d "$HOME/.mida"

      - name: Request and approve two agents in a project folder
        run: |
          set -o pipefail
          mkdir -p "$HOME/demo-project" && cd "$HOME/demo-project"
          git init -q .
          mida request claude-code 2>&1 | tee /tmp/log/request-claude-code.txt
          mida request codex 2>&1 | tee /tmp/log/request-codex.txt
          cat > /tmp/yes.exp <<'EOF'
          set timeout 240
          spawn {*}$argv
          expect {
            -re {[Tt]ype yes[^\n:]*:} { sleep 1; send "yes\r"; exp_continue }
            eof
          }
          lassign [wait] pid spawnid os_error value
          exit $value
          EOF
          expect /tmp/yes.exp mida approve --all 2>&1 | tee /tmp/log/approve.txt
          test -f .mida/project.json

      - name: mida doctor
        run: |
          cd "$HOME/demo-project"
          mida doctor 2>&1 | tee /tmp/log/doctor.txt || true

      - name: Save one checkpoint as claude-code
        run: |
          set -o pipefail
          cd "$HOME/demo-project"
          PROJECT_ID=$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".mida/project.json","utf8")).projectId)')
          mida save-demo claude-code "$PROJECT_ID" 2>&1 | tee /tmp/log/save.txt
          grep -q "^saved 0x" /tmp/log/save.txt

      - name: Codex starts a session and receives the handoff
        run: |
          set -o pipefail
          cd "$HOME/demo-project"
          printf '{"session_id":"wsl-first-run-1","cwd":"%s","hook_event_name":"SessionStart","source":"startup"}' "$PWD" \
            | mida-inject codex 2>&1 | tee /tmp/log/handoff.txt
          grep -q "${{ env.DEMO_OBJECTIVE }}" /tmp/log/handoff.txt
          date -u +"handoff %FT%TZ" | tee -a /tmp/log/times.txt

      - name: Revoke codex, then its next session gets nothing
        run: |
          set -o pipefail
          cd "$HOME/demo-project"
          expect /tmp/yes.exp mida revoke codex 2>&1 | tee /tmp/log/revoke.txt
          printf '{"session_id":"wsl-first-run-2","cwd":"%s","hook_event_name":"SessionStart","source":"startup"}' "$PWD" \
            | mida-inject codex 2>&1 | tee /tmp/log/handoff-after-revoke.txt
          if grep -q "${{ env.DEMO_OBJECTIVE }}" /tmp/log/handoff-after-revoke.txt; then
            echo "FAIL: a revoked agent still received the checkpoint"; exit 1
          fi
          date -u +"revoked %FT%TZ" | tee -a /tmp/log/times.txt

      - name: File permissions, the background service, and the times
        if: always()
        run: |
          echo "home folder mode: $(stat -c '%a' "$HOME/.mida" 2>/dev/null || echo none)"
          echo "files readable by group or others (names only):"
          find "$HOME/.mida" -type f -perm /077 -printf '%m %P\n' 2>/dev/null || true
          pgrep -fl midad || true
          cat /tmp/log/times.txt 2>/dev/null || true
