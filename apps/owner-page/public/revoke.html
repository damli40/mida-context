<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mida — revoke an agent</title>
  <link rel="stylesheet" href="./owner.css">
  <script src="./revoke.js" defer></script>
</head>
<body>
  <main>
    <h1>Revoke an agent</h1>
    <p>This ends everything the agent below can do — and locks it out of what it already read.</p>

    <section class="pairing">
      <p id="pairing-label">Only approve if this code matches your terminal:</p>
      <code id="pairing-code">…</code>
    </section>

    <p class="identity" id="identity-line"></p>

    <pre id="summary">Reading the chain…</pre>

    <section id="sign-list"></section>

    <button id="go" type="button" disabled>Use your passkey to revoke</button>

    <p id="error" hidden></p>
    <ul id="progress"></ul>

    <section id="result" hidden>
      <h2 id="result-status"></h2>
      <pre id="result-json"></pre>
    </section>
  </main>
</body>
</html>
