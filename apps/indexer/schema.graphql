# Mida Context indexer schema.
# Everything here is derived from public on-chain events: addresses, bytes32 ids,
# counters and timestamps. No secrets, no plaintext context — the chain only ever
# sees commitments and ids, and so does this index.

# Singleton row (id is always "global"): the headline counts a judge can check.
# "activeGrants" means "granted and not revoked" — expiry is a wall-clock fact the
# index cannot evaluate, so readers must filter on Grant.expiresAt themselves.
type GlobalStats {
  id: ID!
  owners: Int!
  agents: Int!
  operators: Int!
  agentsByOutsideOperators: Int!
  grants: Int!
  activeGrants: Int!
  capabilityRevocations: Int!
  agentRevocations: Int!
  contextRecords: Int!
  supersessions: Int!
  evidenceRecords: Int!
  lastBlock: Int!
  lastTimestamp: BigInt!
}

# One row per distinct owner address seen in any owner-bearing event.
# An "owner" is an address, not a person — one team can be many addresses.
# batchedSaves counts SaveAnchored events for this owner (the batched lane);
# those saves never appear in ContextRecord and never count in records.
type Owner {
  id: ID!
  firstSeenBlock: Int!
  grants: Int!
  revocations: Int!
  records: Int!
  p256Registered: Boolean!
  batchedSaves: Int!
}

# Singleton row (id is always "global"): counts for the BatchAnchor lane.
# "batches" is BatchAnchored events; "anchoredSaves"/"rejectedSaves" are the
# per-save SaveAnchored/SaveRejected log lines — never derived from the batch
# summary's own accepted/rejected fields, so the summary cannot double-count.
type BatchStats {
  id: ID!
  batches: Int!
  anchoredSaves: Int!
  rejectedSaves: Int!
}

# One row per save anchored inside a batch (id = contextId). Written from the
# per-save SaveAnchored log line — never from the BatchAnchored summary, so a
# re-delivered event cannot write a second row. Batched saves never appear in
# ContextRecord; this is where a reader checks a batched record's anchoring.
type BatchedSave {
  id: ID!
  owner: String! @index
  namespaceId: String!
  batchId: String!
  position: Int!
  lineageId: String!
  version: Int!
  agentId: String!
  block: Int!
  txHash: String!
}

# One row per distinct operator address seen registering an agent.
type Operator {
  id: ID!
  agentsRegistered: Int!
  firstSeenBlock: Int!
}

# One row per registered agentId.
# isOutsideOperator is the traction signal: true when the operator address that
# registered the agent is not in the indexer's OUR_OPERATORS env list.
type Agent {
  id: ID!
  operator: String!
  signer: String!
  registeredBlock: Int!
  revokedByOwners: Int!
  manifestVersion: BigInt!
  isOutsideOperator: Boolean!
  encryptionKeyVersion: Int
  callbackOriginHash: String
}

# One row per granted capability (id = capabilityId).
# revokedBlock is set when the grant stopped conferring authority — either a
# CapabilityRevoked event ("capability") or an AgentRevoked event that killed every
# grant of that (owner, agent) pair ("agent"). On-chain the latter does not set the
# capability's revoked flag; it advances the owner-agent epoch instead.
type Grant {
  id: ID!
  owner: String! @index
  agent: String! @index
  namespaceId: String!
  permissions: Int!
  provenancePolicy: Int!
  expiresAt: BigInt!
  grantedBlock: Int!
  revokedBlock: Int
  revokedBy: String
  txHash: String!
}

# Bookkeeping row per (owner, agentId) pair — the ids of its still-active grants.
# Lets AgentRevoked find and end every grant of the pair without a query.
type AgentGrantBook {
  id: ID!
  activeCapabilityIds: [String!]!
}

# One row per revocation event observed on-chain.
# kind is "capability" (one grant ended) or "agent" (the whole pair ended).
type Revocation {
  id: ID!
  owner: String! @index
  kind: String!
  agentId: String!
  namespaceId: String
  capabilityId: String
  block: Int!
  timestamp: BigInt!
  txHash: String!
}

# One row per record stored on the ContextRegistry (id = contextId).
# Evidence writes emit both ContextRegistered and EvidenceRegistered, so a row here
# may be recordType 0 (context) or 1 (evidence) — only type 0 counts in
# GlobalStats.contextRecords; type 1 counts in evidenceRecords.
type ContextRecord {
  id: ID!
  owner: String! @index
  namespaceId: String!
  author: String!
  lineageId: String!
  parentId: String!
  recordType: Int!
  kind: Int!
  version: Int!
  readEpoch: BigInt!
  createdAt: BigInt!
  expiresAt: BigInt!
  provenanceSource: Int!
  supersededBy: String
  supersededBlock: Int
  registeredBlock: Int!
  txHash: String!
}

# Per-owner event timeline, newest first when ordered by (block desc, logIndex desc).
# Only owner-bearing events produce entries — agent lifecycle events
# (AgentRegistered, key rotations, manifest updates) and NamespaceRegistered carry
# no owner and are intentionally absent here.
type TimelineEntry {
  id: ID!
  owner: String! @index
  kind: String!
  block: Int!
  logIndex: Int!
  timestamp: BigInt!
  txHash: String!
  agentId: String
  namespaceId: String
  capabilityId: String
  contextId: String
}

# Idempotency marker: one row per processed event, keyed "${txHash}-${logIndex}".
# A re-processed event (reorg, restart, replay) finds its marker and is skipped
# before any counter moves.
type ProcessedEvent {
  id: ID!
}

# One row per registered namespace. Not counted in GlobalStats — kept so readers
# can resolve namespace ids to names.
type Namespace {
  id: ID!
  parentId: String!
  name: String!
  highSensitivity: Boolean!
  registeredBlock: Int!
}
