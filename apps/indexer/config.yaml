# Mida Context indexer — Envio HyperIndex config (envio v3).
#
# A redeploy is planned: when the contracts move, update the two `address:` values under
# `chains.contracts` and the `start_block` below — they are the ONLY places those values
# live. Then regenerate the ABI files if the contracts changed (`pnpm --filter @mida/indexer
# export-abis`) and redeploy the indexer.
name: mida-context-indexer
description: >-
  Public, checkable counts of who uses Mida Context: owners, agents, operators,
  outside-operator agents, grants, revocations and context records on Monad testnet.
  This index informs; it never decides access.
ecosystem: evm
address_format: lowercase

# Select transaction fields delivered to every event's handler. `hash` is required:
# idempotency markers, timeline ids and Grant.txHash are all keyed on it.
field_selection:
  transaction_fields:
    - hash

# Contract definitions (ABI + which events to index). Addresses live per-chain below.
contracts:
  - name: CapabilityRegistry
    abi_file_path: ./abi/CapabilityRegistry.json
    handler: ./src/EventHandlers.ts
    events:
      - event: AgentRegistered
      - event: AgentRevoked
      - event: AgentCapabilityManifestUpdated
      - event: AgentEncryptionKeyRotated
      - event: AgentOriginChanged
      - event: AgentSigningKeyRotated
      - event: CapabilityGranted
      - event: CapabilityRevoked
      - event: NamespaceRegistered
      - event: NamespaceEpochKeySet
      - event: P256KeyRegistered
      - event: ReadEpochRequired
  - name: ContextRegistry
    abi_file_path: ./abi/ContextRegistry.json
    handler: ./src/EventHandlers.ts
    events:
      - event: ContextRegistered
      - event: ContextSuperseded
      - event: EvidenceRegistered
  # BatchAnchor is the batched-checkpoint lane (plan 2026-09-24-batch-anchor Task 9).
  # The index only counts its events — it never decides a save's validity.
  - name: BatchAnchor
    abi_file_path: ./abi/BatchAnchor.json
    handler: ./src/EventHandlers.ts
    events:
      - event: SaveAnchored
      - event: SaveRejected
      - event: BatchAnchored

chains:
  # Monad testnet, read through Monad's public RPC. Envio 3 reads HyperSync only with an
  # ENVIO_API_TOKEN, and Envio Cloud's free plan has no environment variables to hold one, so
  # an indexer left on HyperSync there waits forever with no data (Sep 30, 2026). An `rpc`
  # entry `for: sync` makes Envio drop HyperSync for this chain. The public RPC answers at
  # most 100 blocks per log request, hence the two interval settings.
  - id: 10143
    start_block: 65178864
    rpc:
      url: https://testnet-rpc.monad.xyz
      for: sync
      initial_block_interval: 100
      interval_ceiling: 100
    contracts:
      - name: CapabilityRegistry
        address: "0xadfbebc7a653e4287ae30c87d32d7ad647d7039b"
      - name: ContextRegistry
        address: "0x75fb6db9af93a8d823e51c488caa913ca711fb78"
      - name: BatchAnchor
        # contracts/deployments/10143.json batchAnchor. Deployed later than the
        # other two contracts, so it scans from its own start_block (batchAnchorBlock).
        address: "0xe5dcf76b1109906a16587cd2fe02c1e6f4a7a9e1"
        start_block: 65373247
